name: Combined store Tests (vector+storage)

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
    secrets:
      TURBO_TOKEN:
        required: false
      TURBO_TEAM:
        required: false
      PINECONE_API_KEY:
        required: false
      ASTRA_DB_ENDPOINT:
        required: false
      ASTRA_DB_TOKEN:
        required: false
      ABHI_CLOUDFLARE_API_TOKEN:
        required: false
      ABHI_CLOUDFLARE_ACCOUNT_ID:
        required: false

permissions: {}

jobs:
  setup:
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      stores: ${{ steps.set-stores.outputs.stores }}
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - id: set-stores
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STORES=$(ls -d stores/*/ | grep -v '_test-utils' | cut -f2 -d'/' | jq -R -s -c 'split("\n")[:-1]')
          INVALID_STORES=$(echo "$STORES" | jq -r '.[] | select(test("^[a-zA-Z0-9_-]+$") | not)')
          if [[ -n "$INVALID_STORES" ]]; then
            echo "::error::Invalid store names: $INVALID_STORES"
            exit 1
          fi

          # Check if we should include vectorize tests
          # Only run vectorize tests for dane-ai-mastra bot's version packages PRs
          PR_DATA=$(gh api "/repos/${{ github.repository }}/commits/${{ inputs.head_sha }}/pulls" --jq '.[0] | {user: .user.login, title: .title}' 2>/dev/null || echo '{}')
          PR_USER=$(echo "$PR_DATA" | jq -r '.user // ""')
          PR_TITLE=$(echo "$PR_DATA" | jq -r '.title // ""')
          IS_VERSIONING_PR=false
          if [[ "$PR_USER" == "dane-ai-mastra" ]] && [[ "$PR_TITLE" == "chore: version packages" || "$PR_TITLE" == "chore: version packages (alpha)" ]]; then
            IS_VERSIONING_PR=true
          fi

          if [[ "$IS_VERSIONING_PR" == "true" ]]; then
            echo "✓ This is a version packages PR from dane-ai-mastra bot - vectorize tests will run"
          else
            echo "✗ Not a version packages PR from dane-ai-mastra bot - filtering out vectorize tests"
            STORES=$(echo "$STORES" | jq -c '[.[] | select(. != "vectorize")]')
          fi

          echo "stores=$STORES" >> $GITHUB_OUTPUT

  test:
    needs: setup
    if: ${{ github.repository == 'mastra-ai/mastra' }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 15
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        store: ${{fromJson(needs.setup.outputs.stores)}}
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r

    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build combined storage packages
        run: pnpm turbo --filter "@mastra/${{ matrix.store }}" build
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Run ${{ matrix.store }} tests
        run: pnpm test
        working-directory: stores/${{ matrix.store }}
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'
          PINECONE_API_KEY: ${{ secrets.PINECONE_API_KEY }}
          ASTRA_DB_ENDPOINT: ${{ secrets.ASTRA_DB_ENDPOINT }}
          ASTRA_DB_TOKEN: ${{ secrets.ASTRA_DB_TOKEN }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.ABHI_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.ABHI_CLOUDFLARE_ACCOUNT_ID }}

  oracle-integration:
    needs: setup
    if: ${{ github.repository == 'mastra-ai/mastra' && contains(fromJson(needs.setup.outputs.stores), 'oracledb') }}
    runs-on: starsling-ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - release: 23ai
            version: '23.9.'
            image: gvenzl/oracle-free:23.9-slim-faststart@sha256:6e0217d72368dd9c213d75274bc2bcb1682a103680090998a8943a173670aba3
          - release: 26ai
            version: '23.26.3.'
            image: gvenzl/oracle-free:23.26.3-slim-faststart@sha256:f5ff19033860d662c821cb04eb10483fa94f14f78eae252d054291ea07028093
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
      TURBO_CACHE: remote:r
      COMPOSE_PROJECT_NAME: mastra-oracle-${{ matrix.release }}
      ORACLE_DATABASE_IMAGE: ${{ matrix.image }}
      ORACLE_DATABASE_USER: mastra_test
      ORACLE_DATABASE_PASSWORD: mastra_test_password
      ORACLE_DATABASE_CONNECT_STRING: localhost:1521/FREEPDB1
      ORACLE_DATABASE_VERSION_PREFIX: ${{ matrix.version }}
      ORACLE_REQUIRE_HNSW: 'true'
      ORACLE_BENCHMARK_REPORT: oracle-benchmark.jsonl
    steps:
      - uses: actions/checkout@e8d4307400f9427dba7cb98e488d6ab85f1cec5f
        timeout-minutes: 20
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false

      - name: Setup pnpm and Node.js
        uses: ./.github/actions/setup-pnpm-node

      - name: Build Oracle storage and dependencies
        run: pnpm turbo --filter @mastra/oracledb build
        env:
          NODE_OPTIONS: '--max_old_space_size=8192'

      - name: Start Oracle ${{ matrix.release }} with vector memory
        working-directory: stores/oracledb
        run: |
          docker compose up -d --wait
          docker compose restart db
          docker compose up -d --wait

      - name: Run Oracle storage and vector integrations
        working-directory: stores/oracledb
        run: |
          pnpm test:storage-integration
          pnpm test:vector-integration

      - name: Show Oracle logs on failure
        if: failure()
        working-directory: stores/oracledb
        run: docker compose logs db

      - name: Upload Oracle framework and vector measurements
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: oracle-benchmark-${{ matrix.release }}
          path: stores/oracledb/oracle-benchmark.jsonl
          if-no-files-found: warn

      - name: Stop Oracle
        if: always()
        working-directory: stores/oracledb
        run: docker compose down -v
